# JobStreet PH + Indeed PH -> Telegram
# Polls both sites (non-voice Cebu by default) and notifies on NEW jobs.
#
# Secrets:
#   TELEGRAM_BOT_TOKEN (required)
#   TELEGRAM_CHAT_ID   (required)
#   KEYWORDS           (optional) shared by JobStreet + Indeed
#   JOBSTREET_URL      (optional) full search URL when KEYWORDS empty
#   INDEED_URL         (optional) full search URL when KEYWORDS empty
#   JOBSTREET_LOCATION / INDEED_LOCATION (optional)
#   ENABLE_JOBSTREET / ENABLE_INDEED (optional; default true)
#   RESEND_ALL         (optional) true once to dump current matches
#
# External cron (cron-job.org) should POST:
#   URL:  .../actions/workflows/jobstreet-notify.yml/dispatches
#   Body: {"ref":"main"}
# See EXTERNAL_CRON.md

name: JobStreet + Indeed Telegram Notify

on:
  schedule:
    # Best-effort backup; prefer external cron every 15 min
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [poll]

permissions:
  contents: write
  actions: write

concurrency:
  group: jobstreet-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          google-chrome --version || chromium --version || true

      - name: Restore seen-job state (cache)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: jobstreet-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jobstreet-seen-

      - name: Restore seen-job state (git branch)
        run: |
          mkdir -p state
          git fetch origin state:refs/remotes/origin/state 2>/dev/null || true
          if git show origin/state:seen_jobs.json > /tmp/seen_from_branch.json 2>/dev/null; then
            BRANCH_COUNT=$(python -c "import json; d=json.load(open('/tmp/seen_from_branch.json')); print(len(d.get('seen_ids',[])))")
            CACHE_COUNT=0
            if [ -f state/seen_jobs.json ]; then
              CACHE_COUNT=$(python -c "import json; d=json.load(open('state/seen_jobs.json')); print(len(d.get('seen_ids',[])))")
            fi
            echo "Branch seen IDs: $BRANCH_COUNT | Cache seen IDs: $CACHE_COUNT"
            if [ "$BRANCH_COUNT" -ge "$CACHE_COUNT" ]; then
              cp /tmp/seen_from_branch.json state/seen_jobs.json
              echo "Using state branch copy"
            else
              echo "Keeping cache copy (more IDs)"
            fi
          else
            echo "No state branch yet (will create after poll)"
          fi

      - name: Poll once and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOBSTREET_URL: ${{ secrets.JOBSTREET_URL }}
          INDEED_URL: ${{ secrets.INDEED_URL }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          JOBSTREET_LOCATION: ${{ secrets.JOBSTREET_LOCATION }}
          INDEED_LOCATION: ${{ secrets.INDEED_LOCATION }}
          ENABLE_JOBSTREET: ${{ secrets.ENABLE_JOBSTREET }}
          ENABLE_INDEED: ${{ secrets.ENABLE_INDEED }}
          RESEND_ALL: ${{ secrets.RESEND_ALL }}
          MAX_PAGES: "2"
          REQUEST_DELAY_SECONDS: "2"
          SEND_ON_FIRST_RUN: "false"
          # GitHub runner IPs often get HTTP 403 from JobStreet/Cloudflare;
          # Selenium + real Chrome bypasses that (same idea as CSC notifier).
          FORCE_SELENIUM: "true"
          HEADLESS: "true"
          STATE_FILE: state/seen_jobs.json
        run: |
          mkdir -p state
          echo "=== Poll start $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          echo "Event: ${{ github.event_name }}"
          # Empty ENABLE_* secrets mean "true" (default both sources on)
          if [ -z "$ENABLE_JOBSTREET" ]; then export ENABLE_JOBSTREET=true; fi
          if [ -z "$ENABLE_INDEED" ]; then export ENABLE_INDEED=true; fi
          echo "ENABLE_JOBSTREET=$ENABLE_JOBSTREET ENABLE_INDEED=$ENABLE_INDEED"
          if [ -z "$KEYWORDS" ]; then
            echo "KEYWORDS empty/unset - default non-voice Cebu on each site"
          else
            echo "KEYWORDS set: $KEYWORDS"
          fi
          if [ -n "$JOBSTREET_LOCATION" ]; then
            echo "JOBSTREET_LOCATION: $JOBSTREET_LOCATION"
          fi
          if [ -n "$INDEED_LOCATION" ]; then
            echo "INDEED_LOCATION: $INDEED_LOCATION"
          fi
          if [ -n "$INDEED_URL" ]; then
            echo "INDEED_URL override set"
          fi
          if [ -f state/seen_jobs.json ]; then
            echo "Seen state file size: $(wc -c < state/seen_jobs.json) bytes"
            python -c "import json; d=json.load(open('state/seen_jobs.json')); print('Seen IDs:', len(d.get('seen_ids',[])))"
          else
            echo "No seen state yet (first poll will seed)"
          fi
          python notify.py --once
          echo "=== Poll end $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

      - name: Save seen-job state (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: jobstreet-seen-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist seen-job state (git branch)
        if: always()
        run: |
          if [ ! -f state/seen_jobs.json ]; then
            echo "No state file to persist"
            exit 0
          fi
          WORK=/tmp/js-state
          rm -rf "$WORK"
          if git fetch origin state:refs/remotes/origin/state 2>/dev/null; then
            git worktree add -B state "$WORK" origin/state
          else
            git worktree add --detach "$WORK"
            git -C "$WORK" checkout --orphan state
            git -C "$WORK" rm -rf . 2>/dev/null || true
          fi
          cp state/seen_jobs.json "$WORK/seen_jobs.json"
          git -C "$WORK" config user.name "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add seen_jobs.json
          if git -C "$WORK" diff --cached --quiet; then
            echo "State unchanged - skip commit"
          else
            git -C "$WORK" commit -m "chore: update seen job IDs ($(date -u +%Y-%m-%dT%H:%MZ))"
            git -C "$WORK" push origin state
            echo "Pushed state branch"
          fi
